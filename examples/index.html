<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Gemini Chatbot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
      text-align: center;
    }

    .section {
      margin-bottom: 30px;
    }

    .section h2 {
      font-size: 16px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
      borders-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .file-input-wrapper {
      position: relative;
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="file"],
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="file"]:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .results {
      margin-top: 20px;
      padding: 20px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }

    .success {
      background-color: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid #2e7d32;
      padding: 15px;
      border-radius: 4px;
    }

    .error {
      background-color: #ffebee;
      color: #c62828;
      border-left: 4px solid #c62828;
      padding: 15px;
      border-radius: 4px;
    }

    .answer {
      background-color: #f3e5f5;
      color: #4a148c;
      border-left: 4px solid #7b1fa2;
      padding: 15px;
      border-radius: 4px;
    }

    .answer strong {
      display: block;
      margin-bottom: 8px;
      color: #7b1fa2;
    }

    .info {
      background-color: #e3f2fd;
      color: #1565c0;
      border-left: 4px solid #1976d2;
      padding: 15px;
      border-radius: 4px;
      font-size: 13px;
      margin-top: 15px;
    }

    .file-input-wrapper + .file-input-wrapper {
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 24px;
      }

      .file-input-wrapper {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 RAG Gemini Chatbot</h1>

    <div class="section">
      <h2>📄 Upload Document</h2>
      <div class="file-input-wrapper">
        <input type="file" id="fileInput" accept=".pdf,.txt" />
        <button id="uploadBtn">Upload</button>
      </div>
      <div class="info">
        <strong>Supported formats:</strong> PDF (.pdf), Plain Text (.txt)
      </div>
    </div>

    <div class="section">
      <h2>❓ Ask a Question</h2>
      <div class="file-input-wrapper">
        <input type="text" id="questionInput" placeholder="Ask a question about your document..." />
        <button id="askBtn">Ask</button>
      </div>
    </div>

    <div id="results"></div>
  </div>

  <script src="../examples/client.js"></script>
</body>
</html>
