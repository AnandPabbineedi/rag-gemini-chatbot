[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-gemini-chatbot-backend"
version = "2.0.0"
description = "FastAPI backend for Ask Your Documents with vectorized in-memory search and least-token Gemini fallback"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Anand Pabbineedi" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "google-genai>=2.0.0",
    "pypdf>=5.0.0",
    "numpy>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
