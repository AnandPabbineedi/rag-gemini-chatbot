services:
  rag-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-app
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=3000
    networks:
      - rag-network

  rag-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "80:80"
    depends_on:
      - rag-app
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge